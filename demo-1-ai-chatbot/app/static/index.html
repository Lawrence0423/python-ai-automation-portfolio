<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Chatbot Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8fb;
      color: #102033;
    }
    main {
      width: min(780px, calc(100% - 32px));
      margin: 48px auto;
      background: #fff;
      border: 1px solid #d9e1ea;
      border-radius: 8px;
      padding: 28px;
    }
    h1 { margin-top: 0; font-size: 30px; }
    .log {
      min-height: 220px;
      border: 1px solid #d9e1ea;
      border-radius: 6px;
      padding: 16px;
      background: #fbfcfe;
      margin-bottom: 16px;
    }
    .message {
      margin: 12px 0;
      padding: 10px 12px;
      border-radius: 6px;
    }
    .user { background: #eaf2ff; }
    .bot { background: #edf7f1; }
    form {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 6px;
      background: #146c43;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Support Chatbot Demo</h1>
    <p>Try asking: "How do I return an order?" or "Where can I check my order status?"</p>
    <div id="log" class="log"></div>
    <form id="chat-form">
      <input id="message" name="message" placeholder="Type a support question" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </main>
  <script>
    const log = document.querySelector("#log");
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message");

    function addMessage(text, type) {
      const node = document.createElement("div");
      node.className = `message ${type}`;
      node.textContent = text;
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, "user");
      input.value = "";
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await response.json();
      addMessage(`${data.answer} (${data.source}, confidence ${data.confidence})`, "bot");
    });
  </script>
</body>
</html>
